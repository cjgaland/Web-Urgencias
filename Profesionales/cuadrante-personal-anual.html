<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cuadrante personal anual</title>
<style>
:root{
  --bg:#f6f8fb;--card:#fff;--muted:#64748b;--border:#e6eef8;--ink:#0f172a;--wknd:#fff6f6;
  --pill-bg:#e9f2ff;--pill-ink:#003a70;--accent:#0ea5e9;--accent-ink:#0b4a6e;
  /* escala que se aplicará SOLO en impresión (la ajusta JS antes de imprimir) */
  --print-scale: 1;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;background:var(--bg);margin:0;padding:1rem;color:var(--ink)}
h1{margin:.2rem 0 .6rem 0;text-align:center;font-size:1.9rem}
.pill{display:inline-block;border-radius:999px;background:var(--pill-bg);color:var(--pill-ink);padding:.30rem .7rem;font-weight:700}
.pill.name{font-size:1.15rem;margin-left:.55rem}
.panel{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1rem 1.25rem 1rem}

.year-nav{display:flex;align-items:center;justify-content:center;gap:.75rem;margin:.2rem 0 .7rem}
.year-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:.35rem .55rem;cursor:pointer;line-height:1}
.year-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.year-pill{background:#eef7ff;color:#083a63}

.toolbar{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin:.5rem 0 .75rem;align-items:center}
.filter-options { 
  display: inline-flex; 
  gap: 0.75rem; 
  align-items: center; 
  margin-left: 1rem; 
  padding-left: 1rem; 
  border-left: 2px solid #eee; 
}
.filter-options label { cursor: pointer; font-size: 0.9em; white-space: nowrap; }
.filter-options input[type="radio"] { margin-right: 0.25rem; vertical-align: middle;}
.table-wrap{overflow:auto}

table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{border:1px solid #eef2f7;text-align:center;padding:.3rem .4rem;white-space:nowrap}
.mes-head{font-weight:600;background:#f1f4f8;text-align:left;padding-left:.6rem}
.dow-row td{background:#fafbfc;font-size:.75rem;color:#6b7280}
.wknd{background:var(--wknd)}

.legend{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.75rem;font-size:.85rem}
.legend .item{display:flex;align-items:center;gap:.4rem;border:1px solid var(--border);border-radius:999px;padding:.25rem .55rem;background:#fff}
.legend .badge{width:14px;height:14px;border-radius:4px}
.chips{margin-top:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:#f4f6f9;border-radius:999px;padding:.3rem .7rem;margin:.2rem;font-size:.85rem}

.actions-bottom{display:flex;justify-content:center;gap:.6rem;margin-top:1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border);background:#fff;border-radius:999px;padding:.5rem .9rem;cursor:pointer;font-weight:600}
.btn:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn i{font-style:normal}

.notice{background:#fff7ed;border:1px solid #fde4c7;color:#92400e;border-radius:12px;padding:.6rem .8rem;text-align:center;margin:.6rem auto;max-width:720px}

/* Turnos asistenciales */
.shift-M{background:#E6F4EA}.shift-T{background:#E6ECFF}.shift-G{background:#EAF7FF}.shift-O{background:#FFF0F5}
.shift-F{background:#FFF5E6}.shift-FO{background:#FFECEC}.shift-R{background:#E0F7FA}.shift-VA{background:#F0FFF4}
.shift-CON{background:#FFF0F0}

/* Turnos NO asistenciales */
.shift-V{background:#FDF4FF}.shift-S{background:#F5F7FA;color:#99A3AD}.shift-LD{background:#F0FDF4}
.shift-FR{background:#F3E8FF}.shift-OT{background:#F2F2F2}.shift-SD{background:#F8FAFF}
.shift-LS{background:#F0F7FF}.shift-BL{background:#FFF0F0}.shift-BM{background:#FFF7FA}
.shift-LDA{background:#FFF4E6}

.muted{color:#6b7280}

/* ===== Impresión / PDF ===== */
@media print{
  /* A4 horizontal; top right bottom left */
  @page { size: A4 landscape; margin: 10mm 12mm 10mm 10mm; }

  /* Oculta controles y quita límites/padding para aprovechar ancho */
  .actions-bottom, .toolbar, .year-nav, .filter-options { display:none !important; }
  .panel { border:none; max-width:none; padding:0; }

  /* SIN transform ni zoom: que @page mande */
  html, body { width:auto; height:auto; }

  /* La tabla ocupa todo el ancho imprimible, sin scroll horizontal */
  .table-wrap { overflow:visible !important; }
  table {
    width:100% !important;
    table-layout:fixed;         /* reparte el ancho entre columnas */
    border-collapse:collapse;
  }

  /* Cabeceras repetidas en cada página */
  thead { display:table-header-group; }
  tfoot { display:table-footer-group; }

  /* Celdas: varias líneas, pero NO partir "M+G" */
  th, td {
    white-space:normal;
    word-break:normal;          /* evita partir códigos cortos */
    overflow-wrap:break-word;   /* rompe en espacios/guiones si hace falta */
    padding:.24rem .22rem;
  }

  /* Evitar cortar filas entre páginas */
  tr { page-break-inside:avoid; }

  /* Ajuste fino de anchos para ganar espacio en la tabla */
  th.mes-head, td.mes-head { width:22mm; }        /* columna "Mes" un poco más estrecha */
  thead th:last-child, tbody td:last-child { width:34mm; } /* "Obs." algo más compacta */

  /* Si quieres aún un pelín más de densidad, descomenta: */
  /* table { font-size: .65rem; } */
}

</style>
</head>
<body>
<div class="panel">
  <h1>
    Cuadrante personal anual
    <span id="nombrePill" class="pill name"></span>
  </h1>

  <!-- Navegador de año -->
  <div class="year-nav">
    <button id="prevYear" class="year-btn" title="Año anterior" aria-label="Año anterior">◀︎</button>
    <span id="yearPill" class="pill year-pill"></span>
    <button id="nextYear" class="year-btn" title="Año siguiente" aria-label="Año siguiente">▶︎</button>
  </div>

  <!-- Barra de herramientas unificada -->
  <div class="toolbar">
    <!-- Botones de filtro estilo mensual -->
    <div class="filter-options">
      <strong style="margin-right: 0.25rem;">Mostrar:</strong>
      <label><input type="radio" name="filtroTipo" value="todo" checked> Todo</label>
      <label><input type="radio" name="filtroTipo" value="asistencial"> Asistencial</label>
      <label><input type="radio" name="filtroTipo" value="no-asistencial"> No Asistencial</label>
    </div>
    
    <!-- Separador visual -->
    <span style="color: var(--muted); margin: 0 0.5rem;">|</span>
    
    <!-- Casilla de verificación -->
    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
      <input id="chkDow" type="checkbox" style="margin: 0;">
      <span>Mostrar días de semana</span>
    </label>
  </div>

  <!-- Tabla -->
  <div class="table-wrap" id="tabla"></div>

  <!-- Mensaje sin actividad anual -->
  <div id="noActivity" class="notice" style="display:none"></div>

  <h3>Leyenda</h3>
  <div id="leyenda" class="legend"></div>

  <h3>Totales acumulados</h3>
  <div id="totales" class="chips"></div>

  <!-- Acciones al final -->
  <div class="actions-bottom">
    <button class="btn" id="btnPrint"><i>🖨️</i> Imprimir</button>
    <button class="btn" id="btnPdf"><i>⬇️</i> Descargar PDF</button>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  const pad2=n=>String(n).padStart(2,'0');
  const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // === Parámetros ===
  const params = new URLSearchParams(location.search);
  const nombreParam=decodeURIComponent(params.get('nombre')||'');
  const csvnameParam=decodeURIComponent(params.get('csvname')||'');
  let anioParam=(params.get('anio')||String(new Date().getFullYear()));
  $('nombrePill').textContent = nombreParam || csvnameParam || '';

  // Año/mes actuales (para limitar el año en curso)
  const CURR_YEAR = new Date().getFullYear();
  const CURR_MONTH = new Date().getMonth()+1;

  // === CODIGOS ACTUALIZADOS ===
  const CODIGOS={
    // ASISTENCIALES
    M:{nombre:'Mañana 08–15',clase:'shift-M',tipo:'asistencial'},
    T:{nombre:'Tarde 15–22',clase:'shift-T',tipo:'asistencial'},
    G:{nombre:'Guardia laborable 15–08',clase:'shift-G',tipo:'asistencial'},
    O:{nombre:'Guardia Observación 08–15 (día sig.)',clase:'shift-O',tipo:'asistencial'},
    F:{nombre:'Guardia Festivo 09–09',clase:'shift-F',tipo:'asistencial'},
    FO:{nombre:'Obs. Festivo 10–10',clase:'shift-FO',tipo:'asistencial'},
    R:{nombre:'Refuerzo 10–22 (sólo findes/festivos)',clase:'shift-R',tipo:'asistencial'},
    
    // NO ASISTENCIALES
    V:{nombre:'Vacaciones',clase:'shift-V',tipo:'no-asistencial'},
    VA:{nombre:'Vacaciones asistencial',clase:'shift-VA',tipo:'no-asistencial'},
    S:{nombre:'Saliente',clase:'shift-S',tipo:'no-asistencial'},
    LD:{nombre:'Libre disposición',clase:'shift-LD',tipo:'no-asistencial'},
    LDA:{nombre:'Libre disposición anual',clase:'shift-LDA',tipo:'no-asistencial'},
    FR:{nombre:'Formación',clase:'shift-FR',tipo:'no-asistencial'},
    CON:{nombre:'Congresos/Reunión/Simposio',clase:'shift-CON',tipo:'no-asistencial'},
    OT:{nombre:'Otros',clase:'shift-OT',tipo:'no-asistencial'},
    SD:{nombre:'Saliente diferido',clase:'shift-SD',tipo:'no-asistencial'},
    LS:{nombre:'Liberación sindical',clase:'shift-LS',tipo:'no-asistencial'},
    BL:{nombre:'Baja laboral',clase:'shift-BL',tipo:'no-asistencial'},
    BM:{nombre:'Baja maternal',clase:'shift-BM',tipo:'no-asistencial'}
  };

  // Definir turnos asistenciales para filtrado
  const TURNOS_ASISTENCIALES = ['M', 'T', 'G', 'O', 'F', 'FO', 'R'];
  
  // Filtro actual
  let filtroActual = 'todo';

  // === Utilidades CSV ===
  function normalize(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
  function parseCSV(text){
    const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
    return lines.map(line=>{
      const cells=[];let cur='',inQ=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i],next=line[i+1];
        if(ch=='"'){if(inQ&&next=='"'){cur+='"';i++;}else{inQ=!inQ;}}
        else if(ch==','&&!inQ){cells.push(cur);cur='';}
        else{cur+=ch;}
      } cells.push(cur); return cells;
    });
  }
  function buscarFila(rows){
    const prefer=csvnameParam||nombreParam||'';
    const pref=normalize(prefer);
    for(let i=1;i<rows.length;i++){
      const n=(rows[i][0]||'').trim();
      if(n===prefer || n.toLowerCase()===prefer.toLowerCase() || normalize(n)===pref) return rows[i];
    }
    const tokens=pref.split(/\s+/).filter(t=>t.length>2);
    for(let i=1;i<rows.length;i++){
      const n=(rows[i][0]||'').trim();
      if(tokens.some(t=>normalize(n).includes(t))) return rows[i];
    }
    return null;
  }
  function daysInMonth(y,m){return new Date(y,m,0).getDate();}

  async function cargarMes(y,m){
    const csvPath=`../../Cuadrantes/data/cuadrantes/${y}-${pad2(m)}.csv`;
    try{
      const txt=await fetch(csvPath+'?v='+Date.now()).then(r=>r.ok?r.text():Promise.reject('no CSV'));
      const rows=parseCSV(txt);
      if(!rows.length) return null;
      const fila=buscarFila(rows);
      return {header:rows[0],fila};
    }catch{return null;}
  }

  function extractTokens(raw){
    return (raw||'')
      .toUpperCase()
      .replace(/[+\/\-;,]/g,' ')       // separadores → espacio
      .split(/\s+/)
      .map(t=>t.trim())
      .filter(t=>t && (t in CODIGOS)); // sólo códigos conocidos
  }

  function aplicarFiltro(tokens, filtro) {
    if (filtro === 'todo') return tokens;
    
    if (filtro === 'asistencial') {
      return tokens.filter(token => TURNOS_ASISTENCIALES.includes(token));
    }
    
    if (filtro === 'no-asistencial') {
      return tokens.filter(token => !TURNOS_ASISTENCIALES.includes(token));
    }
    
    return tokens;
  }

  /* ========= RENDER ANUAL (enero–diciembre salvo año en curso) ========= */
  async function renderAnual(showDOW){
    $('yearPill').textContent = anioParam;
    // Actualiza la URL sin recargar
    const newParams=new URLSearchParams(location.search);
    newParams.set('anio', anioParam);
    history.replaceState(null, '', location.pathname+'?'+newParams.toString());

    const cont=$('tabla');
    const totales={};
    let huboActividadEnElAnio=false;

    let html='<table><thead><tr><th class="mes-head">Mes</th>';
    for(let d=1; d<=31; d++){ html += `<th>${d}</th>`; }
    html += '<th>Obs.</th></tr></thead><tbody>';

    // *** AQUÍ LA LÓGICA DE LÍMITE DE MESES ***
    const yearNum = parseInt(anioParam,10);
    const maxMonth = (yearNum === CURR_YEAR) ? CURR_MONTH : 12;

    for(let m=1; m<=maxMonth; m++){
      const nd=daysInMonth(anioParam,m);
      let res=null;
      try{ res=await cargarMes(anioParam,m); }catch{ res=null; }

      const header = res && res.header ? res.header : null;
      const fila   = res ? res.fila : null;

      const colIndex={};
      if(header){ header.forEach((h,i)=>colIndex[h]=i); }

      if(showDOW){
        html += `<tr class="dow-row"><td class="mes-head"></td>`;
        for(let d=1; d<=31; d++){
          if(d<=nd){
            const dow=new Date(yearNum,m-1,d).getDay();
            const wk=(dow===0||dow===6)?' wknd':'';
            html += `<td class="${wk}">${['D','L','M','X','J','V','S'][dow]}</td>`;
          } else { html += '<td></td>'; }
        }
        html += '<td></td></tr>';
      }

      html += `<tr><td class="mes-head">${MESES_L[m-1]}</td>`;
      let huboActividadEnEsteMes=false;

      for(let d=1; d<=31; d++){
        if(d<=nd){
          if(fila && header){
            const idx = colIndex[String(d)];
            const val = idx != null ? (fila[idx]||'').trim() : '';
            const tokens = extractTokens(val);
            const tokensFiltrados = aplicarFiltro(tokens, filtroActual);
            
            if(tokensFiltrados.length){ 
              huboActividadEnElAnio=true; 
              huboActividadEnEsteMes=true; 
            }
            
            // Contar solo los tokens que pasan el filtro
            tokensFiltrados.forEach(tok => { 
              totales[tok] = (totales[tok] || 0) + 1; 
            });
            
            const primary=tokensFiltrados[0]||'';
            const cls=primary&&CODIGOS[primary]?CODIGOS[primary].clase:'';
            const dow=new Date(yearNum,m-1,d).getDay();
            const wk=(dow===0||dow===6)?' wknd':'';
            const title=`${anioParam}-${pad2(m)}-${pad2(d)} · ${['D','L','M','X','J','V','S'][dow]}${val?(' · '+val):''}`;
            
            // Mostrar solo los tokens filtrados
            const displayVal = tokensFiltrados.length > 0 ? tokensFiltrados.join('+') : '';
            html += `<td class="${cls}${wk}" title="${title}">${displayVal}</td>`;
          }else{
            const dow=new Date(yearNum,m-1,d).getDay();
            const wk=(dow===0||dow===6)?' wknd':'';
            html += `<td class="${wk}"></td>`;
          }
        } else { html += '<td></td>'; }
      }

      if(fila && header){
        const idxObs = colIndex['Obs.'];
        const obsTxt = idxObs != null ? (fila[idxObs] || '') : '';
        html += `<td>${obsTxt || (huboActividadEnEsteMes ? '' : '<span class="muted"><i>SIN ACTIVIDAD ESTE MES</i></span>')}</td></tr>`;
      } else {
        html += `<td class="muted"><i>SIN ACTIVIDAD ESTE MES</i></td></tr>`;
      }
    }

    html += '</tbody></table>';
    cont.innerHTML = html;

    const noAct = $('noActivity');
    if(!huboActividadEnElAnio){
      noAct.style.display='block';
      noAct.textContent='Este año no ha habido actividad registrada para este profesional.';
    }else{
      noAct.style.display='none';
      noAct.textContent='';
    }

    // Leyenda filtrada
    const ley=$('leyenda'); ley.innerHTML='';
    Object.entries(CODIGOS).forEach(([k,def])=>{
      // Aplicar filtro a la leyenda
      if (filtroActual === 'asistencial' && !TURNOS_ASISTENCIALES.includes(k)) return;
      if (filtroActual === 'no-asistencial' && TURNOS_ASISTENCIALES.includes(k)) return;
      
      const el=document.createElement('div');
      el.className='item';
      el.innerHTML=`<span class="badge ${def.clase}"></span><b>${k}</b> <span class="muted">${def.nombre}</span>`;
      ley.appendChild(el);
    });

    // Totales filtrados
    const tot=$('totales'); tot.innerHTML='';
    Object.keys(totales).sort().forEach(k=>{
      const def=CODIGOS[k];
      // Aplicar filtro a los totales
      if (filtroActual === 'asistencial' && !TURNOS_ASISTENCIALES.includes(k)) return;
      if (filtroActual === 'no-asistencial' && TURNOS_ASISTENCIALES.includes(k)) return;
      
      const box=document.createElement('div');
      box.className='chip';
      box.innerHTML=`<span class="badge ${def.clase}"></span><b>${k}</b> · ${totales[k]} día(s)`;
      tot.appendChild(box);
    });

    // Mostrar total general si hay filtro activo
    if (filtroActual !== 'todo') {
      const totalDias = Object.values(totales).reduce((sum, count) => sum + count, 0);
      const boxTotal = document.createElement('div');
      boxTotal.className='chip';
      boxTotal.style.background = '#0ea5e9';
      boxTotal.style.color = 'white';
      boxTotal.innerHTML = `<b>TOTAL ${filtroActual.toUpperCase()}</b> · ${totalDias} día(s)`;
      tot.appendChild(boxTotal);
    }
  }

  // Render inicial y eventos
  renderAnual(false);
  $('chkDow').addEventListener('change',e=>renderAnual(e.target.checked));

  $('prevYear').addEventListener('click',()=>{ anioParam=String(parseInt(anioParam,10)-1); renderAnual($('chkDow').checked); });
  $('nextYear').addEventListener('click',()=>{ anioParam=String(parseInt(anioParam,10)+1); renderAnual($('chkDow').checked); });

  // Filtros con radio buttons
  document.querySelectorAll('input[name="filtroTipo"]').forEach(radio => {
    radio.addEventListener('change', function() {
      filtroActual = this.value;
      renderAnual($('chkDow').checked);
    });
  });

  // Botones imprimir / PDF (ambos abren el diálogo del navegador)
  $('btnPrint').addEventListener('click', ()=> window.print());
  $('btnPdf').addEventListener('click',   ()=> window.print()); // usa "Guardar como PDF"
</script>
</body>
</html>
