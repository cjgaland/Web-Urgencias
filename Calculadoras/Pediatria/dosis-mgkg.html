<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dosis mg/kg - Urgencias</title>

<!-- Estilos comunes de calculadoras -->
<link rel="stylesheet" href="../css/calculadoras-common.css">
</head>
<body>
<div class="card">
  <h1>Dosis mg/kg</h1>
  <p class="sub">
    Calcula la dosis en mg y el volumen a administrar según peso, dosis por kg y concentración.
  </p>

  <form id="formCalc" class="grid">
    
    <div class="row">
      <label for="weight">Peso (kg)</label>
      <div class="ig">
        <input id="weight" type="number" min="0" step="0.1" placeholder="Ej. 18" required />
        <span></span>
      </div>
    </div>

    <div class="row">
      <label for="mgkg">Dosis (mg/kg)</label>
      <div class="ig">
        <input id="mgkg" type="number" min="0" step="0.01" placeholder="Ej. 10" required />
        <span></span>
      </div>
    </div>

    <div class="row">
      <label for="maxmg">Dosis máxima (mg) (opcional)</label>
      <div class="ig">
        <input id="maxmg" type="number" min="0" step="1" placeholder="Ej. 500" />
        <span></span>
      </div>
    </div>

    <div class="row">
      <label for="conc">Concentración (mg/ml) (opcional)</label>
      <div class="ig">
        <input id="conc" type="number" min="0" step="0.01" placeholder="Para calcular volumen" />
        <span></span>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn primary">Calcular</button>
      <button type="button" id="copyBtn" class="btn secondary">Copiar resultado</button>
      <button type="reset" class="btn secondary">Limpiar</button>
      <span class="spacer"></span>
      <button type="button" id="closeBtn" class="btn close" title="Cerrar esta ventana">Cerrar ventana</button>
    </div>

    <div id="result" class="result" aria-live="polite">Introduce datos y pulsa "Calcular".</div>
    
    <p class="muted">Verifica dosis máximas por fármaco, intervalos, función renal/hepática y presentación disponible. Redondea el volumen a jeringas estandarizadas.</p>
  </form>
</div>

<!-- Scripts comunes -->
<script src="../js/calculadoras-common.js"></script>

<!-- Lógica específica de esta calculadora -->
<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const r = (value, decimals = 2) => Math.round((value + Number.EPSILON) * (10 ** decimals)) / (10 ** decimals);

  $('formCalc').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const weight = parseFloat($('weight').value);
    const mgkg = parseFloat($('mgkg').value);
    const maxmg = parseFloat($('maxmg').value || '0');
    const conc = parseFloat($('conc').value || '0');
    
    if (!(weight > 0) || !(mgkg > 0)) {
      $('result').textContent = 'Por favor, revisa peso y mg/kg.';
      return;
    }
    
    let dose = weight * mgkg;
    let limited = false;
    
    if (maxmg > 0 && dose > maxmg) {
      dose = maxmg;
      limited = true;
    }
    
    let resultado = `Dosis = ${r(dose, 2)} mg`;
    
    if (limited) {
      resultado += ` (limitada por dosis máxima)`;
    }
    
    if (conc > 0) {
      const vol = dose / conc;
      resultado += `\nVolumen ≈ ${r(vol, 2)} ml (a ${r(conc, 2)} mg/ml)`;
    }
    
    $('result').textContent = resultado;
  });
})();
</script>
</body>
</html>
