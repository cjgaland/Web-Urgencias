<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVB · Monitor de actuación</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#dc3545; --rojo-hover:#b02a37;
  --azul:#0d6efd; --azul-hover:#0b5ed7;
  --bg:#eef2f6; --card:#ffffff;
  --text:#0f172a; --muted:#5b6b85;
  --ring:#e6eef8; --shadow:0 8px 24px rgba(0,0,0,.08);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:linear-gradient(135deg,#f7f9fc,#e9eef5);
  color:var(--text); font-family:Roboto,system-ui,-apple-system,Segoe UI,Ubuntu,"Helvetica Neue",Arial;
  display:flex; flex-direction:column;
}

/* CABECERA */
header{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center;
  gap:12px; padding:10px 16px;
}
h1{margin:0; text-align:center; font-size:30px; font-weight:800; letter-spacing:.2px;}
.btn{
  display:inline-flex; align-items:center; gap:.5rem;
  border:none; border-radius:14px; padding:12px 22px; font-weight:700; cursor:pointer;
  box-shadow:var(--shadow); transition:.2s transform, .2s background-color;
}
.btn:active{transform:translateY(1px)}
.btn-reiniciar{ background:var(--rojo); color:#fff; }
.btn-reiniciar:hover{ background:var(--rojo-hover); }
.clock{
  min-width:160px; text-align:center; color:#fff; background:var(--rojo);
  border-radius:14px; padding:10px 16px; font:800 22px/1 "Courier New",monospace; box-shadow:var(--shadow);
}

/* LAYOUT APaisado */
.main{
  display:grid; grid-template-columns: 1fr 46%; gap:26px;
  padding:12px 16px 20px; height:calc(100% - 68px); /* resto tras header */
}

/* COLUMNA IZQUIERDA: pasos */
.panel{
  background:var(--card); border:1px solid var(--ring); border-radius:16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; padding:16px; overflow:auto;
}
.pasos{ display:flex; flex-direction:column; gap:14px; }

.paso{
  background:#fff; border:1px solid var(--ring); border-radius:14px; padding:12px 14px;
  display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center;
}
.paso .top{
  display:flex; align-items:center; gap:10px; font-size:18px; color:var(--text);
}
.paso label{ cursor:pointer; font-weight:600; }
.paso input[type="checkbox"]{ width:18px; height:18px; }
.paso .marca{
  font:800 18px/1 "Courier New",monospace; background:#f7f9ff; border:1px solid #e3eaf6; border-radius:10px; padding:8px 12px;
}
.meta{ grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:.6rem 1rem; color:var(--muted); font-size:.92rem }

.slider-wrap{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding-top:4px; }
.slider-wrap input[type="range"]{ flex:1; }
.bpm-pill{ min-width:64px; text-align:center; font-weight:700; }
.bpm-pill .num{ font-variant-numeric:tabular-nums; }

/* BOTONES inferiores */
.actions{
  display:flex; gap:10px; margin-top:12px; justify-content:flex-end;
}
.btn-info{ background:var(--azul); color:#fff; }
.btn-info:hover{ background:var(--azul-hover); }

/* COLUMNA DERECHA: póster */
.poster{
  background:var(--card); border:1px solid var(--ring); border-radius:16px; box-shadow:var(--shadow);
  padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto;
}
.poster h2{ margin:6px 6px 0 6px; font-size:16px; color:var(--muted) }
.poster .img-wrap{ flex:1; display:flex; align-items:center; justify-content:center; }
.poster img{ max-width:100%; max-height:100%; border-radius:12px; border:1px solid #e9eef6; }

/* DIALOGO INFORME */
dialog{ border:none; border-radius:16px; padding:0; box-shadow:0 24px 60px rgba(0,0,0,.25); width:min(960px,92vw); }
.dialog-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid #e7eef7; }
.dialog-head h3{ margin:0; font-size:20px; }
.dialog-body{ padding:12px 18px 18px; }
.table{ width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
.table th,.table td{ border-bottom:1px solid #eef2f7; padding:8px 10px; text-align:left; white-space:nowrap; }
.table th:nth-child(2), .table td:nth-child(2){ font-family:"Courier New",monospace; }
.table th:nth-child(3), .table td:nth-child(3){ font-family:"Courier New",monospace; }
.table th{ background:#f8fbff; position:sticky; top:0; }
.dialog-actions{ display:flex; justify-content:flex-end; gap:10px; padding:0 18px 16px; }
.btn-ghost{ background:#fff; border:1px solid #e3eaf6; }
@media print{
  body{ background:#fff }
  header, .poster, .actions { display:none !important; }
  dialog{ box-shadow:none; width:100%; }
}
</style>
</head>
<body>

<header>
  <button class="btn btn-reiniciar" id="btnReset"><i class="fa-solid fa-rotate"></i> Reiniciar</button>
  <h1>Soporte Vital Básico</h1>
  <div class="clock" id="clock">00:00:00</div>
</header>

<main class="main">
  <!-- IZQUIERDA: CONTROL -->
  <section class="panel">
    <div class="pasos" id="pasos">
      <!-- Los pasos se inyectan desde JS para tener todo homogéneo -->
    </div>

    <div class="actions">
      <button class="btn btn-info" id="btnInforme"><i class="fa-solid fa-file-lines"></i> Informe de actuación</button>
    </div>
  </section>

  <!-- DERECHA: PÓSTER -->
  <aside class="poster">
    <h2>Referencia rápida (póster SVAB)</h2>
    <div class="img-wrap">
      <img src="https://cjgaland.github.io/Web-Urgencias/Algoritmos/Emergencias/SVAB/img/SVAB.jpg"
           alt="Póster SVAB / DEA · secuencia de actuación">
    </div>
  </aside>
</main>

<!-- DIALOGO: INFORME -->
<dialog id="dlg">
  <div class="dialog-head">
    <h3>Informe de actuación · SVB</h3>
    <button class="btn btn-ghost" id="dlgClose" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="dialog-body">
    <table class="table" id="tablaInforme">
      <thead>
        <tr>
          <th>Paso</th>
          <th>Hora real</th>
          <th>Tiempo desde inicio</th>
          <th>Intervalo desde anterior</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="dialog-actions">
    <button class="btn btn-ghost" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
    <button class="btn btn-info" id="dlgOk">Cerrar</button>
  </div>
</dialog>

<script>
/* =========================
   RELOJ GENERAL (auto-inicio)
========================= */
let t0 = new Date(); // inicio absoluto
let tickTimer = null;
const clockEl = document.getElementById('clock');

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtHMS(ms){
  const s = Math.floor(ms/1000);
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
  return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
}
function updateClock(){
  const now = Date.now();
  clockEl.textContent = fmtHMS(now - t0.getTime());
}

/* =========================
   DEFINICIÓN DE PASOS
========================= */
const PASOS = [
  { id:'resp',   icon:'fa-person-circle-check',  nombre:'Comprobación de respuesta' },
  { id:'avis',   icon:'fa-phone',                nombre:'Llamada al 112 / 088' },
  { id:'rcp',    icon:'fa-hands-praying',        nombre:'Inicio de masaje cardiaco' , metrónomo:true },
  { id:'via',    icon:'fa-lungs',                nombre:'Comprobación de vía aérea' },
  { id:'viaiv',  icon:'fa-syringe',              nombre:'Canalización de vía y toma de muestras' },
  { id:'const',  icon:'fa-heart-pulse',          nombre:'Toma de constantes' },
  { id:'monit',  icon:'fa-wave-square',          nombre:'Monitorización cardiaca' },
  { id:'fin',    icon:'fa-flag-checkered',       nombre:'Fin del proceso' }
];

const pasosWrap = document.getElementById('pasos');
const estado = {}; // {id: { ts:Date, delta:Number, dom:{...}}}

/* Render */
PASOS.forEach((p,idx)=>{
  const el = document.createElement('div');
  el.className = 'paso';
  el.innerHTML = `
    <div class="top">
      <input type="checkbox" id="cb-${p.id}">
      <label for="cb-${p.id}"><i class="fa-solid ${p.icon}" aria-hidden="true"></i> ${pad2(idx+1)} · ${p.nombre}</label>
    </div>
    <div class="marca" id="tm-${p.id}">—:—:—</div>
    <div class="meta" id="meta-${p.id}">
      <span id="hr-${p.id}"><strong>Hora:</strong> —:—:—</span>
      <span id="t0-${p.id}"><strong>Desde inicio:</strong> —:—:—</span>
    </div>
    ${p.metrónomo ? `
      <div class="slider-wrap">
        <span>Ritmo:</span>
        <input type="range" id="bpm-${p.id}" min="100" max="120" value="105" step="1" disabled>
        <span class="bpm-pill"><span class="num" id="bpmVal-${p.id}">105</span> lpm</span>
      </div>` : ``}
  `;
  pasosWrap.appendChild(el);

  estado[p.id] = {
    idx, ts:null,
    dom:{
      cb: el.querySelector(`#cb-${p.id}`),
      mark: el.querySelector(`#tm-${p.id}`),
      hora: el.querySelector(`#hr-${p.id}`),
      t0: el.querySelector(`#t0-${p.id}`),
      bpm: p.metrónomo ? el.querySelector(`#bpm-${p.id}`) : null,
      bpmVal: p.metrónomo ? el.querySelector(`#bpmVal-${p.id}`) : null
    }
  };
});

/* =========================
   METRÓNOMO (WebAudio)
========================= */
let audioCtx=null, beepInterval=null, BPM=105;
const clampBPM = v => Math.max(100, Math.min(120, Math.round(v)));
const msPerBeat = () => 60000 / BPM;

function playBeep(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}
function startBeep(){
  if(!beepInterval){ beepInterval = setInterval(playBeep, msPerBeat()); }
}
function stopBeep(){
  clearInterval(beepInterval); beepInterval=null;
}
function setBPM(v){
  BPM = clampBPM(v);
  if(beepInterval){ clearInterval(beepInterval); beepInterval=setInterval(playBeep, msPerBeat()); }
}

/* Vincular slider del paso RCP */
const rcp = estado['rcp'];
rcp.dom.bpm.addEventListener('input', e=>{
  rcp.dom.bpmVal.textContent = e.target.value;
  setBPM(+e.target.value);
});

/* =========================
   LÓGICA de marcado
========================= */
function marcarPaso(id){
  const s = estado[id];
  if(s.ts) return; // no desmarcable
  s.ts = new Date();
  const ms = s.ts.getTime() - t0.getTime();
  s.dom.mark.textContent = fmtHMS(ms);
  s.dom.hora.innerHTML = `<strong>Hora:</strong> ${s.ts.toLocaleTimeString('es-ES')}`;
  s.dom.t0.innerHTML   = `<strong>Desde inicio:</strong> ${fmtHMS(ms)}`;
  s.dom.cb.disabled = true;

  // acciones especiales
  if(id==='rcp'){
    // habilitar slider y arrancar beep a 105
    rcp.dom.bpm.disabled = false;
    setBPM(+rcp.dom.bpm.value || 105);
    startBeep();
  }
  if(id==='fin'){
    stopBeep();
  }
}

Object.values(estado).forEach(s=>{
  s.dom.cb.addEventListener('change', e=>{
    if(e.target.checked) marcarPaso(PASOS[s.idx].id);
    else e.target.checked = true; // impedir desmarcar
  });
});

/* =========================
   INFORME
========================= */
const btnInforme = document.getElementById('btnInforme');
const dlg = document.getElementById('dlg');
const dlgClose = document.getElementById('dlgClose');
const dlgOk = document.getElementById('dlgOk');

btnInforme.addEventListener('click', ()=>{
  // Crear filas ordenadas por índice
  const rows = PASOS.map(p=>{
    const s = estado[p.id];
    return { p, ts: s.ts ? new Date(s.ts) : null };
  }).sort((a,b)=> (a.p.idx - b.p.idx));

  // Calcular deltas
  let prev = null;
  const tbody = dlg.querySelector('tbody');
  tbody.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    let hora = '—', t0s='—', delta='—';
    if(r.ts){
      const ms = r.ts.getTime() - t0.getTime();
      hora = r.ts.toLocaleTimeString('es-ES');
      t0s = fmtHMS(ms);
      if(prev){ delta = fmtHMS(r.ts.getTime() - prev.getTime()); }
      prev = r.ts;
    }
    tr.innerHTML = `
      <td>${pad2(r.p.idx+1)} · ${r.p.nombre}</td>
      <td>${hora}</td>
      <td>${t0s}</td>
      <td>${delta}</td>
    `;
    tbody.appendChild(tr);
  });
  dlg.showModal();
});
[dlgClose, dlgOk].forEach(b=> b.addEventListener('click', ()=> dlg.close()) );

/* =========================
   REINICIAR
========================= */
document.getElementById('btnReset').addEventListener('click', ()=>{
  stopBeep();
  t0 = new Date();
  Object.values(estado).forEach(s=>{
    s.ts=null;
    s.dom.cb.checked=false; s.dom.cb.disabled=false;
    s.dom.mark.textContent='—:—:—';
    s.dom.hora.innerHTML='<strong>Hora:</strong> —:—:—';
    s.dom.t0.innerHTML  ='<strong>Desde inicio:</strong> —:—:—';
  });
  rcp.dom.bpm.disabled = true;
  rcp.dom.bpm.value = 105; rcp.dom.bpmVal.textContent = '105';
  // reiniciar reloj
  clearInterval(tickTimer);
  tickTimer = setInterval(updateClock, 1000);
  updateClock();
});

/* Arranques */
tickTimer = setInterval(updateClock, 1000);
updateClock(); // primer pintado
</script>
</body>
</html>
