<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Generador Tratamiento Hiponatremia Mejorado</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 90%; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background-color: #f4f4f4; }
  h2, h3 { color: #2c3e50; }
  label { margin-right: 10px; }
  input, select { margin-bottom: 10px; }
</style>
</head>
<body>

<h2>Generador de Tratamiento para Hiponatremia - Versión Mejorada</h2>

<form id="tratamientoForm">
  <div>
    <label for="peso">Peso (Kg):</label>
    <input type="number" id="peso" value="80" min="1" step="0.1" required />
  </div>

  <div>
    <label for="naActual">Sodio Actual (mEq/l):</label>
    <input type="number" id="naActual" value="115" min="100" max="150" step="0.1" required />
  </div>

  <div>
    <label for="naDeseado">Sodio Deseado (mEq/l):</label>
    <input type="number" id="naDeseado" value="130" min="120" max="150" step="0.1" required />
  </div>

  <div>
    <label for="glucosa">Glucosa (mg/dl):</label>
    <input type="number" id="glucosa" value="135" min="0" step="0.1" />
  </div>

  <div>
    <label for="urea">Urea (mg/dl):</label>
    <input type="number" id="urea" value="42" min="0" step="0.1" />
  </div>

  <hr/>

  <h3>Preparación de Solución Salina</h3>

  <div>
    <label for="tipoSuero">Tipo de Suero:</label>
    <select id="tipoSuero">
      <option value="hipertonico">Salina Hipertónica (ejemplo 3%)</option>
      <option value="fisiologico">Salina Fisiológica (0.9%)</option>
    </select>
  </div>

  <div>
    <label for="volSuero">Volumen Suero (ml):</label>
    <input type="number" id="volSuero" value="400" min="50" step="1" />
  </div>

  <div>
    <label for="concentracionAmpolla">% Cloruro Sódico Ampolla:</label>
    <select id="concentracionAmpolla">
      <option value="10">10%</option>
      <option value="20" selected>20%</option>
    </select>
  </div>

  <div>
    <label for="volAmpolla">Volumen Ampolla (ml):</label>
    <select id="volAmpolla">
      <option value="5">5 ml</option>
      <option value="10" selected>10 ml</option>
    </select>
  </div>

  <button type="button" onclick="calcularTratamiento()">Calcular Tratamiento</button>
</form>

<div id="resultado"></div>

<script>
function calcularTratamiento() {
  // Datos clínicos
  const peso = parseFloat(document.getElementById('peso').value);
  const naActual = parseFloat(document.getElementById('naActual').value);
  const naDeseado = parseFloat(document.getElementById('naDeseado').value);
  const glucosa = parseFloat(document.getElementById('glucosa').value);
  const urea = parseFloat(document.getElementById('urea').value);
  
  // Preparación solución
  const tipoSuero = document.getElementById('tipoSuero').value;
  const volSuero = parseFloat(document.getElementById('volSuero').value);
  const concAmpolla = parseFloat(document.getElementById('concentracionAmpolla').value) / 100;
  const volAmpolla = parseFloat(document.getElementById('volAmpolla').value);

  // Agua corporal total (litros), se usa 0.6 como promedio adulto
  const aguaCorporalTotal = peso * 0.6;

  // Calcular Osmolaridad Plasmática (mOsm/l)
  // Fórmula: 2x Na + glucosa/18 + urea/6 (aprox)
  const osmolaridad = 2 * naActual + glucosa / 18 + urea / 6;

  // Déficit de Na (mEq)
  const deficitNa = (naDeseado - naActual) * aguaCorporalTotal;

  // mEq de Na en las ampollas
  // Cloruro sódico 10g / 100 ml  es 1 g / 10 ml
  // 1 g de NaCl contiene aprox 17.1 mEq de Na
  // Por tanto:
  // mEq Na por ml = 17.1 mEq * (concentracion%) * (volAmpolla/10 ml)
  // Se simplifica:
  const mEqNaAmpolla = 17.1 * concAmpolla * (volAmpolla / 10);

  // mEq Na en solución salina base
  // Salina fisiológica 0.9% contiene 154 mEq Na/l => 0.154 mEq/ml
  // Salina hipertónica al 3% contiene aprox 513 mEq Na/l => 0.513 mEq/ml
  let meqNaSolucion;
  if (tipoSuero === 'fisiologico') {
    meqNaSolucion = 0.154 * volSuero;
  } else {
    meqNaSolucion = 0.513 * volSuero;
  }

  // Volumen total preparado = vol suero base + volumen total de ampollas (suponemos ampollas sumadas 1 unidad)
  const volTotalSolucion = volSuero + volAmpolla;

  // Concentración final % (aprox)
  const concFinal = (mEqNaAmpolla + meqNaSolucion) / volTotalSolucion * 100 / 17.1; // % NaCl

  // Objetivos de tratamiento: dividir déficit en dos fases ordenadas en la hoja Excel
  const obj1_mEq = deficitNa / 2;
  const obj2_mEq = deficitNa - obj1_mEq;

  // Ritmo infusión en ml/hora en función del volumen preparado y mEq a reponer
  // ml/h = (volTotalSolucion) * (mEq a reponer en fase) / (mEq total en solucion) / (horas fase)
  const ritmoObj1 = (volTotalSolucion * obj1_mEq) / (mEqNaAmpolla + meqNaSolucion) / 12;
  const ritmoObj2 = (volTotalSolucion * obj2_mEq) / (mEqNaAmpolla + meqNaSolucion) / 24;

  // Mostrar resultados
  const htmlResultado = `
  <h3>Resultado del Tratamiento</h3>
  <table>
    <tr><th>Parámetro</th><th>Valor</th><th>Unidad</th></tr>
    <tr><td>Agua Corporal Total</td><td>${aguaCorporalTotal.toFixed(2)}</td><td>litros</td></tr>
    <tr><td>Osmolaridad Plasmática</td><td>${osmolaridad.toFixed(2)}</td><td>mOsm/l</td></tr>
    <tr><td>Déficit de Sodio</td><td>${deficitNa.toFixed(2)}</td><td>mEq</td></tr>
    <tr><td>mEq Na Ampollas</td><td>${mEqNaAmpolla.toFixed(2)}</td><td>mEq</td></tr>
    <tr><td>mEq Na Solución Base</td><td>${meqNaSolucion.toFixed(2)}</td><td>mEq</td></tr>
    <tr><td>Volumen Total Solución Preparada</td><td>${volTotalSolucion.toFixed(2)}</td><td>ml</td></tr>
    <tr><td>Concentración Final</td><td>${concFinal.toFixed(2)}</td><td>%</td></tr>
    <tr><td>Objetivo 1 (12h)</td><td>${obj1_mEq.toFixed(2)}</td><td>mEq</td></tr>
    <tr><td>Ritmo Infusión 1</td><td>${ritmoObj1.toFixed(2)}</td><td>ml/hora</td></tr>
    <tr><td>Objetivo 2 (24h)</td><td>${obj2_mEq.toFixed(2)}</td><td>mEq</td></tr>
    <tr><td>Ritmo Infusión 2</td><td>${ritmoObj2.toFixed(2)}</td><td>ml/hora</td></tr>
  </table>`;

  document.getElementById('resultado').innerHTML = htmlResultado;
}
</script>

</body>
</html>
