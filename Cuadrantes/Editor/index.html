<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Editor de cuadrantes · Urgencias</title>
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ... (Estilos generales que ya tenías) ... */
body{font-family:'Roboto',sans-serif;background:#f4f7fb;color:#333;margin:0}
.wrap{max-width:1600px;margin:1.5rem auto;padding:0 1.5rem}
.panel{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.07);padding:1.2rem 1.5rem}
h1,h2{color:#00457c;margin:0 0 1rem}
.grid-cols-2{display:grid;grid-template-columns:300px 1fr;gap:1rem}
.flex-col{display:flex;flex-direction:column;gap:.75rem}
.flex-row{display:flex;align-items:center;gap:.75rem}
label{font-weight:600;font-size:.9rem;color:#333}
textarea,select,input[type="number"],input[type="text"]{width:100%;padding:.6rem .75rem;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:1rem;box-sizing:border-box}
textarea{font-family:monospace;font-size:.9rem;min-height:200px;resize:vertical}
button{padding:.6rem 1rem;border:none;border-radius:8px;background:#00457c;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .2s ease}
button:hover{background:#00335c}
button.secondary{background:#e2e8f0;color:#333}
button.secondary:hover{background:#cbd5e1}
button.blue{background:#1e88e5} button.blue:hover{background:#1565c0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;table-layout:fixed}
thead th{position:sticky;top:0;background:#f7fafc;padding:.5rem;z-index:1}
th,td{border-bottom:1px solid #eee;padding:.3rem .4rem;text-align:center;border-right:1px solid #eee}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;border-right:2px solid #ddd;width:140px;font-weight:600}
tbody td:not(:first-child){width:45px;min-width:45px}
tbody td[contenteditable="true"]:focus{outline:2px solid #1e88e5;background:#f0f8ff}
.dow-D, .dow-S, .dow-V, .dow-F { background:#f7f9fc; }

/* Paleta de colores */
#palette{position:fixed;bottom:1rem;right:1rem;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:.7rem;display:grid;grid-template-columns:repeat(6,auto);gap:.5rem;z-index:100}
#palette button{padding:0;width:40px;height:32px;font-size:1rem;font-weight:700;border:1px solid rgba(0,0,0,.1);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#palette button:hover{transform:scale(1.1);border-color:rgba(0,0,0,.3)}

/* Colores de turnos (copiados de la plantilla) */
.shift-M{background:#E6F4EA}
.shift-T{background:#E6ECFF}
.shift-G{background:#EAF7FF}
.shift-O{background:#FFF0F5}
.shift-F{background:#FFF5E6}
.shift-FO{background:#FFECEC}
.shift-R{background:#E0F7FA}
.shift-V{background:#FDF4FF}
.shift-S{background:#F5F7FA;color:#99A3AD}
.shift-LD{background:#F0FDF4}
.shift-FR{background:#F3E8FF}
.shift-OT{background:#F2F2f2}
.shift-SD{background:#E8F5E9}
.shift-LS{background:#FFFDE7}
.shift-BL{background:#FFEBEE}
.shift-BM{background:#E1F5FE}
.shift-RD{background:#E6FFF8}

/* === NUEVOS CÓDIGOS CON TRAMA (PASO 1) === */
.shift-LDA {
  background-color: #F0FDF4; /* Base de LD */
  background-image: linear-gradient(45deg, rgba(0,0,0,.07) 25%, transparent 25%, transparent 50%, rgba(0,0,0,.07) 50%, rgba(0,0,0,.07) 75%, transparent 75%, transparent);
  background-size: 10px 10px;
}
.shift-VA {
  background-color: #FDF4FF; /* Base de V */
  background-image: linear-gradient(45deg, rgba(0,0,0,.07) 25%, transparent 25%, transparent 50%, rgba(0,0,0,.07) 50%, rgba(0,0,0,.07) 75%, transparent 75%, transparent);
  background-size: 10px 10px;
}
/* === NUEVO CÓDIGO CONGRESO === */
.shift-CON { background: #E0E0E0; } /* Gris claro */
  
/* (HE COMENTADO EL ESTILO DEL "GATE" PARA QUE NO MOLESTE)
#editor-gate{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center}
#gate-box{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#gate-box input{width:200px}
*/
</style>
</head>
<body>

<div id="palette">
  <button type="button" class="shift-M" data-val="M">M</button>
  <button type="button" class="shift-T" data-val="T">T</button>
  <button type="button" class="shift-G" data-val="G">G</button>
  <button type="button" class="shift-O" data-val="O">O</button>
  <button type="button" class="shift-F" data-val="F">F</button>
  <button type="button" class="shift-FO" data-val="FO">FO</button>
  <button type="button" class="shift-R" data-val="R">R</button>
  <button type="button" class="shift-LD" data-val="LD">LD</button>
  <button type="button" class="shift-LDA" data-val="LDA">LDA</button>
  <button type="button" class="shift-V" data-val="V">V</button>
  <button type="button" class="shift-VA" data-val="VA">VA</button>
  <button type="button" class="shift-FR" data-val="FR">FR</button>
  <button type="button" class="shift-S" data-val="S">S</button>
  <button type="button" class="shift-SD" data-val="SD">SD</button>
  <button type="button" class="shift-LS" data-val="LS">LS</button>
  <button type="button" class="shift-BL" data-val="BL">BL</button>
  <button type="button" class="shift-BM" data-val="BM">BM</button>
  <button type="button" class="shift-OT" data-val="OT">OT</button>
  <button type="button" class="shift-RD" data-val="RD">RD</button>
  <button type="button" class="shift-CON" data-val="CON">RD</button>
  <button type="button" class="secondary" data-val="" style="grid-column: span 3">Limpiar</button>
</div>

<div class="wrap">
  <div class="grid-cols-2">
    <div class="panel flex-col" style="height:fit-content">
      <h2>Controles</h2>
      <div class="flex-col">
        <label for="anio">Año</label>
        <input type="number" id="anio" value="2025" min="2020" max="2030" step="1" />
      </div>
      <div class="flex-col">
        <label for="mes">Mes</label>
        <select id="mes">
          <option value="01">01 - Enero</option>
          <option value="02">02 - Febrero</option>
          <option value="03">03 - Marzo</option>
          <option value="04">04 - Abril</option>
          <option value="05">05 - Mayo</option>
          <option value="06">06 - Junio</option>
          <option value="07">07 - Julio</option>
          <option value="08">08 - Agosto</option>
          <option value="09">09 - Septiembre</option>
          <option value="10">10 - Octubre</option>
          <option value="11" selected>11 - Noviembre</option>
          <option value="12">12 - Diciembre</option>
        </select>
      </div>
      <div class="flex-col">
        <label for="profesionales">Profesionales (uno por línea)</label>
        <textarea id="profesionales" rows="12"></textarea>
      </div>
      <div class="flex-row">
        <button type="button" id="btnCargarTxt" class="secondary" title="Cargar lista desde profesionales.txt">Cargar .txt</button>
        <button type="button" id="btnGenerar" class="blue" style="flex:1">Generar cuadrante</button>
      </div>
      <hr style="border:none;border-top:1px solid #eee;margin:.5rem 0">
      <div class="flex-row">
        <button type="button" id="btnImportar" class="secondary" style="flex:1">Importar CSV...</button>
        <input type="file" id="fileInput" accept=".csv" hidden />
      </div>
      <div class="flex-col" style="gap:.5rem">
        <button type="button" id="btnExportar">Exportar CSV</button>
        <button type="button" id="btnCopiar" class="secondary">Copiar CSV al portapapeles</button>
      </div>
    </div>

    <div class="panel">
      <h1 id="tituloTabla">Editor de cuadrante</h1>
      <div style="overflow:auto;max-height:80vh">
        <table id="tablaEditor">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* === Contraseña (HE COMENTADO ESTE BLOQUE ENTERO) ===
(function(){
  const gate = document.getElementById('editor-gate');
  const pass = document.getElementById('pass');
  const btn = document.getElementById('btnEntrar');
  const clave = "MONTILLA_URG_2024"; // Tu clave
  
  function checkSession(){
    if (sessionStorage.getItem('editorAuth') === clave) {
      gate.style.display = 'none';
      document.getElementById('palette').style.display = 'grid';
    } else {
      gate.style.display = 'flex';
    }
  }
  function login(){
    if (pass.value === clave) {
      sessionStorage.setItem('editorAuth', clave);
      checkSession();
    } else {
      alert('Contraseña incorrecta');
    }
  }
  btn.addEventListener('click', login);
  pass.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  checkSession();
})();
*/

// === App ===
const DOW = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// === Carga de profesionales.txt ===
function cargarProfesionales(){
  const txtArea = document.getElementById('profesionales');
  const paths = [
    '../data/profesionales.txt',
    '../../data/profesionales.txt',
    './data/profesionales.txt',
    '/Cuadrantes/data/profesionales.txt'
  ];
  let found = false;
  
  async function tryPath(i){
    if (i >= paths.length) {
      if (!found) txtArea.value = "Error: No se encontró profesionales.txt";
      return;
    }
    try {
      const r = await fetch(`${paths[i]}?v=${Date.now()}`); // anti-cache
      if (r.ok) {
        txtArea.value = await r.text();
        found = true;
      } else {
        await tryPath(i + 1);
      }
    } catch (e) {
      await tryPath(i + 1);
    }
  }
  tryPath(0);
}
document.getElementById('btnCargarTxt').addEventListener('click', cargarProfesionales);
cargarProfesionales(); // Carga automática al inicio

// === Generar tabla ===
document.getElementById('btnGenerar').addEventListener('click', generar);

function getDaysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m=1..12
function getDow(y, m, d) { return new Date(y, m-1, d).getDay(); } // m=1..12, d=1..31

function generar(){
  const anio = parseInt(document.getElementById('anio').value, 10);
  const mesNum = parseInt(document.getElementById('mes').value, 10);
  const numDias = getDaysInMonth(anio, mesNum);
  const mesNombre = MESES[mesNum-1];
  document.getElementById('tituloTabla').textContent = `Cuadrante · ${mesNombre} ${anio}`;
  
  const profesionales = document.getElementById('profesionales').value.split('\n').filter(Boolean).map(s => s.trim());
  
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  thead.innerHTML = '';
  tbody.innerHTML = '';
  
  // Cabecera
  const trHead = document.createElement('tr');
  trHead.innerHTML = '<th>Profesional</th>';
  for(let d=1; d<=numDias; d++){
    const dow = getDow(anio, mesNum, d);
    const th = document.createElement('th');
    th.textContent = `${DOW[dow]} ${d}`;
    th.className = `dow-${DOW[dow]}`;
    trHead.appendChild(th);
  }
  trHead.innerHTML += '<th>Obs.</th>';
  thead.appendChild(trHead);
  
  // Cuerpo
  profesionales.forEach(nombre => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${nombre}</td>`;
    for(let d=1; d<=numDias; d++){
      tr.innerHTML += `<td contenteditable="true" data-d="${d}" data-n="${nombre}"></td>`;
    }
    tr.innerHTML += `<td contenteditable="true" data-d="obs" data-n="${nombre}"></td>`;
    tbody.appendChild(tr);
  });
}

// === Coloreado (Tint) ===
const shiftClasses = [
  'shift-M', 'shift-T', 'shift-G', 'shift-O', 'shift-F', 'shift-FO', 'shift-R', 
  'shift-V', 'shift-VA', /*NUEVO*/
  'shift-S', 
  'shift-LD', 'shift-LDA', /*NUEVO*/
  'shift-FR', 'shift-OT', 'shift-SD', 'shift-LS', 'shift-BL', 'shift-BM', 'shift-RD', 'shift-CON'
];

// (MODIFICADO para incluir LDA y VA)
const shiftColors = {
    'M':'shift-M', 'T':'shift-T', 'G':'shift-G', 'O':'shift-O', 'F':'shift-F', 'FO':'shift-FO', 'R':'shift-R',
    'V':'shift-V',
    'VA':'shift-VA', /* <-- NUEVO */
    'S':'shift-S',
    'LD':'shift-LD',
    'LDA':'shift-LDA', /* <-- NUEVO */
    'FR':'shift-FR', 'OT':'shift-OT', 'SD':'shift-SD', 'LS':'shift-LS', 'BL':'shift-BL', 'BM':'shift-BM', 'RD':'shift-RD', 'CON':'shift-CON'
};

function tokenizar(val){
  const raw = val.toUpperCase().trim();
  if (!raw) return [];
  return raw.split(/[ \\/+\-]+/).filter(Boolean);
}

function tint(cell){
  if (!cell) return;
  cell.classList.remove(...shiftClasses);
  const tokens = tokenizar(cell.textContent || '');
  if (tokens.length > 0) {
    const firstToken = tokens[0];
    if (shiftColors[firstToken]) {
      cell.classList.add(shiftColors[firstToken]);
    }
  }
}

// Event delegation para el tint
document.getElementById('tbody').addEventListener('input', e => {
  if(e.target.tagName === 'TD' && e.target.isContentEditable){
    tint(e.target);
  }
});


// === Paleta ===
let currentCell = null;
document.getElementById('tbody').addEventListener('focusin', e => {
  if(e.target.tagName === 'TD' && e.target.isContentEditable){
    currentCell = e.target;
  }
});
document.getElementById('tbody').addEventListener('focusout', e => {
  // currentCell = null; // No lo ponemos a null para poder hacer clic en la paleta
});

document.getElementById('palette').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !currentCell) return;
  
  const val = btn.dataset.val;
  if (val === '') {
    currentCell.textContent = ''; // Limpiar
  } else {
    // Si la celda está vacía o ya tiene un +, añade. Si no, reemplaza.
    const currentText = (currentCell.textContent || '').trim();
    if (currentText === '') {
      currentCell.textContent = val;
    } else {
      currentCell.textContent = currentText + '+' + val;
    }
  }
  tint(currentCell);
  currentCell.focus();
});


// === Importar / Exportar CSV ===
function exportCSV(copy=false){
  const anio = document.getElementById('anio').value;
  const mes = document.getElementById('mes').value;
  const filename = `${anio}-${mes}.csv`;
  
  const table = document.getElementById('tablaEditor');
  let csv = [];
  
  // Encabezados
  const headers = Array.from(table.querySelectorAll('thead th')).map(th => {
    const txt = th.textContent.replace(/"/g, '""');
    return `"${txt}"`;
  });
  csv.push(headers.join(','));
  
  // Filas
  const rows = table.querySelectorAll('tbody tr');
  rows.forEach(row => {
    const cols = Array.from(row.querySelectorAll('td')).map(td => {
      const txt = td.textContent.replace(/"/g, '""');
      return `"${txt}"`;
    });
    csv.push(cols.join(','));
  });
  
  const csvContent = csv.join('\n');
  
  if (copy) {
    navigator.clipboard.writeText(csvContent).then(() => {
      alert('CSV copiado al portapapeles.');
    }, () => {
      alert('Error al copiar el CSV.');
    });
  } else {
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
  }
}

document.getElementById('btnExportar').addEventListener('click', () => exportCSV(false));
document.getElementById('btnCopiar').addEventListener('click', () => exportCSV(true));

// Importar
document.getElementById('btnImportar').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', importarCSV);

function importarCSV(event){
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = e => {
    const txt = e.target.result;
    const lines = txt.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
    
    // Parsear CSV (simple, asume que tus celdas no tienen comas dentro)
    const data = lines.map(line => {
        return line.split(',').map(cell => cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
    });

    if (data.length < 2) {
      alert("CSV inválido o vacío.");
      return;
    }

    // Regenerar tabla basada en el CSV
    const anio = document.getElementById('anio').value;
    const mesNum = parseInt(document.getElementById('mes').value, 10);
    const numDias = getDaysInMonth(anio, mesNum);
    const mesNombre = MESES[mesNum-1];
    document.getElementById('tituloTabla').textContent = `Cuadrante · ${mesNombre} ${anio} (Importado)`;

    const thead = document.getElementById('thead');
    const tbody = document.getElementById('tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    // Cabecera desde CSV
    const trHead = document.createElement('tr');
    data[0].forEach(cell => trHead.innerHTML += `<th>${cell}</th>`);
    thead.appendChild(trHead);

    // Cuerpo desde CSV
    for(let i=1; i<data.length; i++){
      const r = data[i];
      if (!r || r.length === 0) continue;
      
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r[0] || ''}</td>`; // Nombre
      
      for(let d=1; d<=numDias; d++){
        const td = document.createElement('td');
        td.contentEditable = true;
        td.textContent = r[d] || '';
        tint(td); // Colorear
        tr.appendChild(td);
      }
      
      const tdObs = document.createElement('td'); // Obs.
      tdObs.contentEditable = true;
      tdObs.textContent = r[numDias+1] || '';
      tr.appendChild(tdObs);
      
      tbody.appendChild(tr);
    }
  };
  reader.readAsText(file);
  event.target.value = null; // Reset input
}

</script>
</body>
</html>
