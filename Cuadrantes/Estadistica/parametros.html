<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuadrante – Urgencias · AGS Sur de Córdoba</title>
  <link rel="stylesheet" href="../css/style.css?v=20250824" />
  <style>
    :root { --gap:.5rem; --radius:12px; --shadow:0 2px 12px rgba(0,0,0,.08); }
    body { background:#f4f7fb; }
    .wrap { max-width:1200px; margin:2rem auto; padding:0 1rem; }
    .toolbar { display:flex; gap:var(--gap); align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; }
    .toolbar .left, .toolbar .right { display:flex; gap:var(--gap); align-items:center; }
    .toolbar h1 { font-size:clamp(1.2rem,2vw,1.6rem); font-weight:600; }
    .toolbar .badge { background:#00457c; color:#fff; padding:.35rem .6rem; border-radius:999px; font-size:.85rem; }
    .toolbar button { border:none; border-radius:999px; padding:.55rem .9rem; cursor:pointer; box-shadow:var(--shadow); background:#fff; font-weight:600; }
    .panel { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:1rem; }

    table.cuadrante { width:100%; border-collapse:separate; border-spacing:0; font-size:.92rem; }
    table.cuadrante thead th { position:sticky; top:0; background:#f7fafc; z-index:1; }
    table.cuadrante th, table.cuadrante td { padding:.45rem .5rem; text-align:center; border-bottom:1px solid #eef2f7; }
    table.cuadrante th:first-child, table.cuadrante td:first-child { text-align:left; position:sticky; left:0; background:#fff; }
    
    /* Selección de profesional */
    .selected-professional { background:#e6f3ff !important; font-weight:600; }
    .professional-info { margin:1rem 0; padding:1rem; background:#f0f8ff; border-radius:var(--radius); border-left:4px solid #00457c; }
    .professional-info h3 { margin:0 0 .5rem; color:#00457c; }
    .deviation { font-weight:600; }
    .deviation.positive { color:#2e7d32; }
    .deviation.negative { color:#c62828; }

    /* Colores de turnos */
    .shift-M{background:#E6F4EA}
    .shift-T{background:#E6ECFF}
    .shift-G{background:#EAF7FF}
    .shift-O{background:#FFF0F5}
    .shift-F{background:#FFF5E6}
    .shift-FO{background:#FFECEC}
    .shift-R{background:#E0F7FA}
    .shift-V{background:#FDF4FF}
    .shift-S{background:#F5F7FA;color:#99A3AD}
    .shift-LD{background:#F0FDF4}
    .shift-FR{background:#F3E8FF}
    .shift-OT{background:#F2F2F2}

    .legend { display:flex; flex-wrap:wrap; gap:.5rem .75rem; margin-top:.75rem; }
    .legend .item { display:flex; align-items:center; gap:.35rem; font-size:.9rem; }
    .legend .swatch { width:18px; height:14px; border-radius:4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }

    .totales { margin-top:1rem; display:grid; gap:.5rem; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); }
    .totales .card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:.75rem .9rem; cursor:pointer; transition:transform .2s, box-shadow .2s; }
    .totales .card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.12); }
    .totales .card h3 { font-size:.9rem; font-weight:600; color:#00457c; }
    .totales .card p { margin:.25rem 0 0; font-weight:700; font-size:1.1rem; }
    
    .filter-options { display:flex; align-items:center; gap:.5rem; margin-left:auto; }
    .filter-options label { display:flex; align-items:center; gap:.3rem; font-size:.9rem; cursor:pointer; }

    @media print {
      body { background:#fff; }
      .toolbar, .legend, .professional-info, .filter-options { display:none; }
      .panel { box-shadow:none; border:none; }
      table.cuadrante th, table.cuadrante td { padding:.28rem .3rem; }
      @page { size: landscape; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="left">
        <h1 id="titulo"></h1>
        <span class="badge" id="badge-equipo" title="Área de Urgencias y Observación">Urgencias</span>
      </div>
      <div class="right">
        <div class="filter-options">
          <label>
            <input type="checkbox" id="filter-active" checked />
            Solo profesionales con actividad
          </label>
        </div>
        <button id="btn-print">🖨️ Imprimir</button>
        <button id="btn-pdf">📄 Exportar PDF</button>
        <button id="btn-export">⬇️ Exportar CSV</button>
      </div>
    </div>

    <div class="panel">
      <div id="professional-info-container" style="display:none;">
        <div class="professional-info">
          <h3 id="selected-professional-name"></h3>
          <div id="selected-professional-stats"></div>
        </div>
      </div>
      
      <div style="overflow:auto;">
        <table class="cuadrante" id="tabla">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="legend" id="leyenda"></div>
      <div class="totales" id="totales"></div>
    </div>
  </div>

  <script>
    // Parámetros (?csv=AAAA-MM&mes=M&anno=AAAA). Si faltan, usa mes/año actuales.
    const params = new URLSearchParams(window.location.search);
    const mesParam = parseInt(params.get('mes') || '') || (new Date().getMonth() + 1);
    const annoParam = parseInt(params.get('anno') || '') || (new Date().getFullYear());
    const csvId = params.get('csv') || `${annoParam}-${String(mesParam).padStart(2,'0')}`;

    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const DOW = ['D','L','M','X','J','V','S'];
    const CODIGOS = {
      M:{nombre:'Mañana 08–15', clase:'shift-M'},
      T:{nombre:'Tarde 15–22', clase:'shift-T'},
      G:{nombre:'Guardia laborable 15–08', clase:'shift-G'},
      O:{nombre:'Guardia Observación 08–15 (día sig.)', clase:'shift-O'},
      F:{nombre:'Guardia Festivo 09–09', clase:'shift-F'},
      FO:{nombre:'Obs. Festivo 10–10', clase:'shift-FO'},
      R:{nombre:'Refuerzo 10–22 (sólo findes/festivos)', clase:'shift-R'},
      V:{nombre:'Vacaciones', clase:'shift-V'},
      S:{nombre:'Saliente', clase:'shift-S'},
      LD:{nombre:'Libre disposición', clase:'shift-LD'},
      FR:{nombre:'Formación', clase:'shift-FR'},
      OT:{nombre:'Otros', clase:'shift-OT'}
    };

    const tituloMes = `Cuadrante · ${MESES[mesParam-1]} ${annoParam}`;
    document.getElementById('titulo').textContent = tituloMes;
    document.title = `${tituloMes} – Urgencias · AGS Sur de Córdoba`;

    function daysInMonth(y,m){ 
        return new Date(y, m, 0).getDate(); 
    }
    
    function labelDia(y,m,d){ 
        const dow = new Date(y, m-1, d).getDay(); 
        return `${DOW[dow]} ${d}`; 
    }
    
    const numDias = daysInMonth(annoParam, mesParam);

    // Variables globales para almacenar datos
    let csvData = [];
    let selectedProfessional = null;
    let showOnlyActive = true;

    // Encabezado
    const thead = document.getElementById('thead');
    const trHead = document.createElement('tr');
    const thNombre = document.createElement('th'); 
    thNombre.textContent = 'Profesional'; 
    trHead.appendChild(thNombre);
    
    for (let d=1; d<=numDias; d++){ 
        const th = document.createElement('th'); 
        th.textContent = labelDia(annoParam, mesParam, d); 
        trHead.appendChild(th); 
    }
    
    const thObs = document.createElement('th'); 
    thObs.textContent = 'Obs.'; 
    trHead.appendChild(thObs);
    thead.appendChild(trHead);

    // Leyenda
    const leyenda = document.getElementById('leyenda');
    Object.entries(CODIGOS).forEach(([k,v])=>{
        const item = document.createElement('div'); 
        item.className = 'item'; 
        item.title = v.nombre;
        const sw = document.createElement('span'); 
        sw.className = 'swatch ' + v.clase; 
        item.appendChild(sw);
        const txt = document.createElement('span'); 
        txt.textContent = `${k} = ${v.nombre}`; 
        item.appendChild(txt);
        leyenda.appendChild(item);
    });

    // Cargar CSV
    const csvPath = `data/cuadrantes/${csvId}.csv?v=${Date.now()}`;
    fetch(csvPath)
        .then(r => { 
            if(!r.ok) throw new Error('No se encontró el archivo CSV para el periodo seleccionado.'); 
            return r.text(); 
        })
        .then(txt => { 
            csvData = parseCSV(txt); 
            renderTabla(csvData); 
            renderTotales(csvData); 
        })
        .catch(err => {
            console.error(err);
            const tbody = document.getElementById('tbody');
            const tr = document.createElement('tr');
            const td = document.createElement('td'); 
            td.colSpan = numDias + 2; 
            td.style.textAlign = 'left';
            td.innerHTML = `⚠️ ${err.message}`;
            tr.appendChild(td); 
            tbody.appendChild(tr);
        });

    function parseCSV(input){
        const lines = input.replace(/\r/g,'').split('\n').filter(l => l.trim().length);
        return lines.map(line => {
            const row = []; 
            let cur = ''; 
            let inQ = false;
            for (let i=0; i<line.length; i++){
                const ch = line[i], next = line[i+1];
                if (ch === '"'){ 
                    if(inQ && next === '"'){ 
                        cur += '"'; 
                        i++; 
                    } else { 
                        inQ = !inQ; 
                    } 
                }
                else if (ch === ',' && !inQ){ 
                    row.push(cur); 
                    cur = ''; 
                }
                else { 
                    cur += ch; 
                }
            } 
            row.push(cur); 
            return row;
        });
    }

    function tokenizar(val){
        const raw = val.toUpperCase().trim();
        if (!raw) return [];
        return raw.split(/[ \\/+\-]+/).filter(Boolean);
    }

    function renderTabla(rows){
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        
        for (let i=1; i<rows.length; i++){
            const r = rows[i]; 
            if (!r || !r.length) continue;
            const nombre = (r[0]||'').trim();
            if (!nombre) continue;
            
            // Filtrar profesionales sin actividad si está activado el filtro
            if (showOnlyActive) {
                let hasActivity = false;
                for (let d=1; d<=numDias; d++){
                    const val = (r[d]||'').toString().trim();
                    if (val) {
                        hasActivity = true;
                        break;
                    }
                }
                if (!hasActivity) continue;
            }
            
            const tr = document.createElement('tr');
            tr.dataset.professional = nombre;
            if (selectedProfessional === nombre) {
                tr.classList.add('selected-professional');
            }
            
            const tdNombre = document.createElement('td'); 
            tdNombre.textContent = nombre; 
            tdNombre.style.cursor = 'pointer';
            tdNombre.addEventListener('click', () => selectProfessional(nombre));
            tr.appendChild(tdNombre);
            
            for (let d=1; d<=numDias; d++){
                const td = document.createElement('td');
                const val = (r[d]||'').toString().trim();
                if (val){
                    const tokens = tokenizar(val);
                    const firstKnown = tokens.find(t => CODIGOS[t]);
                    if (firstKnown) td.classList.add(CODIGOS[firstKnown].clase);
                    td.textContent = tokens.join('+');
                }
                tr.appendChild(td);
            }
            const tdObs = document.createElement('td'); 
            tdObs.textContent = (r[numDias+1]||'').trim(); 
            tr.appendChild(tdObs);
            tbody.appendChild(tr);
        }
    }

    function renderTotales(rows){
        const tot = {};
        for (let i=1; i<rows.length; i++){
            const r = rows[i]; 
            const nombre = (r[0]||'').trim(); 
            if (!nombre) continue;
            if (!tot[nombre]) {
                tot[nombre] = {M:0,T:0,G:0,O:0,F:0,FO:0,R:0,V:0,S:0,LD:0,FR:0,OT:0};
            }
            for (let d=1; d<=numDias; d++){
                const val = (r[d]||'').toString().trim(); 
                if (!val) continue;
                const tokens = tokenizar(val);
                for (const t of tokens){ 
                    if (tot[nombre][t] !== undefined) tot[nombre][t]++; 
                }
            }
        }
        
        // Calcular media de turnos para profesionales con actividad
        let totalTurnos = 0;
        let profesionalesConActividad = 0;
        
        Object.values(tot).forEach(counts => {
            const totalJornadas = Object.values(counts).reduce((a,b) => a+b, 0);
            if (totalJornadas > 0) {
                totalTurnos += totalJornadas;
                profesionalesConActividad++;
            }
        });
        
        const mediaTurnos = profesionalesConActividad > 0 ? totalTurnos / profesionalesConActividad : 0;
        
        const box = document.getElementById('totales'); 
        box.innerHTML = '';
        
        Object.entries(tot).forEach(([nombre,counts]) => {
            const totalJornadas = Object.values(counts).reduce((a,b) => a+b, 0);
            
            // Filtrar profesionales sin actividad si está activado el filtro
            if (showOnlyActive && totalJornadas === 0) return;
            
            const c = document.createElement('div'); 
            c.className = 'card';
            if (selectedProfessional === nombre) {
                c.classList.add('selected-professional');
            }
            c.dataset.professional = nombre;
            c.addEventListener('click', () => selectProfessional(nombre));
            
            // Calcular desviación respecto a la media
            const desviacion = totalJornadas - mediaTurnos;
            const desviacionFormatted = desviacion.toFixed(1);
            const desviacionClass = desviacion > 0 ? 'positive' : desviacion < 0 ? 'negative' : '';
            
            c.innerHTML = `<h3>${nombre}</h3><p>${totalJornadas} turnos</p>` +
                `<div style="margin-top:.35rem; display:flex; flex-wrap:wrap; gap:.35rem .6rem; font-size:.85rem;">` +
                Object.entries(counts).filter(([k,v]) => v>0).map(([k,v]) => 
                    `<span class="badge ${CODIGOS[k] ? CODIGOS[k].clase : ''}" style="display:inline-block; padding:.18rem .45rem; border-radius:999px;">${k}: ${v}</span>`
                ).join(' ') +
                `</div>` +
                (mediaTurnos > 0 ? `<div style="margin-top:.5rem; font-size:.85rem;">Desv. media: <span class="deviation ${desviacionClass}">${desviacion > 0 ? '+' : ''}${desviacionFormatted}</span></div>` : '');
            
            box.appendChild(c);
        });
    }

    function selectProfessional(nombre) {
        // Limpiar selección anterior
        if (selectedProfessional) {
            const prevSelected = document.querySelectorAll('.selected-professional');
            prevSelected.forEach(el => el.classList.remove('selected-professional'));
        }
        
        // Establecer nueva selección
        selectedProfessional = nombre;
        
        // Resaltar fila y tarjeta del profesional seleccionado
        const professionalRow = document.querySelector(`tr[data-professional="${nombre}"]`);
        const professionalCard = document.querySelector(`.card[data-professional="${nombre}"]`);
        
        if (professionalRow) professionalRow.classList.add('selected-professional');
        if (professionalCard) professionalCard.classList.add('selected-professional');
        
        // Mostrar información del profesional
        showProfessionalInfo(nombre);
    }

    function showProfessionalInfo(nombre) {
        const container = document.getElementById('professional-info-container');
        const nameElement = document.getElementById('selected-professional-name');
        const statsElement = document.getElementById('selected-professional-stats');
        
        if (!nombre) {
            container.style.display = 'none';
            return;
        }
        
        // Calcular estadísticas del profesional
        const tot = {};
        if (!tot[nombre]) {
            tot[nombre] = {M:0,T:0,G:0,O:0,F:0,FO:0,R:0,V:0,S:0,LD:0,FR:0,OT:0};
        }
        
        for (let i=1; i<csvData.length; i++){
            const r = csvData[i]; 
            const currentNombre = (r[0]||'').trim(); 
            if (currentNombre !== nombre) continue;
            
            for (let d=1; d<=numDias; d++){
                const val = (r[d]||'').toString().trim(); 
                if (!val) continue;
                const tokens = tokenizar(val);
                for (const t of tokens){ 
                    if (tot[nombre][t] !== undefined) tot[nombre][t]++; 
                }
            }
        }
        
        const counts = tot[nombre];
        const totalJornadas = Object.values(counts).reduce((a,b) => a+b, 0);
        
        // Calcular media de turnos para profesionales con actividad
        let totalTurnos = 0;
        let profesionalesConActividad = 0;
        
        for (let i=1; i<csvData.length; i++){
            const r = csvData[i]; 
            const currentNombre = (r[0]||'').trim(); 
            if (!currentNombre) continue;
            
            let hasActivity = false;
            let currentTotal = 0;
            for (let d=1; d<=numDias; d++){
                const val = (r[d]||'').toString().trim(); 
                if (val) {
                    hasActivity = true;
                    const tokens = tokenizar(val);
                    currentTotal += tokens.length;
                }
            }
            
            if (hasActivity) {
                totalTurnos += currentTotal;
                profesionalesConActividad++;
            }
        }
        
        const mediaTurnos = profesionalesConActividad > 0 ? totalTurnos / profesionalesConActividad : 0;
        const desviacion = totalJornadas - mediaTurnos;
        const desviacionFormatted = desviacion.toFixed(1);
        const desviacionClass = desviacion > 0 ? 'positive' : desviacion < 0 ? 'negative' : '';
        
        nameElement.textContent = nombre;
        statsElement.innerHTML = `
            <div><strong>Total de turnos:</strong> ${totalJornadas}</div>
            <div><strong>Media del equipo:</strong> ${mediaTurnos.toFixed(1)}</div>
            <div><strong>Desviación:</strong> <span class="deviation ${desviacionClass}">${desviacion > 0 ? '+' : ''}${desviacionFormatted}</span></div>
            <div style="margin-top:.5rem;"><strong>Distribución:</strong></div>
            <div style="display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.25rem;">
                ${Object.entries(counts).filter(([k,v]) => v>0).map(([k,v]) => 
                    `<span class="badge ${CODIGOS[k] ? CODIGOS[k].clase : ''}" style="display:inline-block; padding:.2rem .5rem; border-radius:999px;">${k}: ${v}</span>`
                ).join(' ')}
            </div>
        `;
        
        container.style.display = 'block';
    }

    // Botones
    document.getElementById('btn-print').addEventListener('click', () => {
        // Configurar orientación horizontal para impresión
        const style = document.createElement('style');
        style.innerHTML = '@page { size: landscape; }';
        document.head.appendChild(style);
        window.print();
        // Eliminar el estilo después de imprimir
        setTimeout(() => style.remove(), 100);
    });
    
    document.getElementById('btn-pdf').addEventListener('click', () => {
        alert('La funcionalidad de exportación a PDF requiere una librería adicional como jsPDF. Esta funcionalidad se implementaría en una versión más avanzada.');
    });
    
    document.getElementById('btn-export').addEventListener('click', () => exportTableToCSV());
    
    document.getElementById('filter-active').addEventListener('change', function() {
        showOnlyActive = this.checked;
        renderTabla(csvData);
        renderTotales(csvData);
        if (selectedProfessional) {
            selectProfessional(selectedProfessional);
        }
    });

    function exportTableToCSV(filename = `cuadrante-${annoParam}-${String(mesParam).padStart(2,'0')}.csv`){
        const table = document.getElementById('tabla');
        const rows = Array.from(table.querySelectorAll('tr'));
        const csv = rows.map(tr => {
            const cells = Array.from(tr.children).map(td => {
                const raw = td.textContent.replace(/^([DLXJVS])\s+/,'').replace(/"/g, '""');
                return /[",\n]/.test(raw) ? `"${raw}"` : raw;
            });
            return cells.join(',');
        }).join('\n');
        
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const link = document.createElement('a'); 
        link.href = URL.createObjectURL(blob); 
        link.download = filename; 
        link.click();
        URL.revokeObjectURL(link.href);
    }
  </script>
</body>
</html>
